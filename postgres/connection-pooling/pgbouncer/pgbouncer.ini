[databases]
db = host=postgres port=5432 dbname=db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

; Transaction mode is the reason to run pgbouncer at all: a server connection
; is held only for the duration of a transaction, so 100 idle clients cost 100
; cheap sockets instead of 100 Postgres processes.
pool_mode = transaction

; 100 clients in front of 5 backends. Well under max_connections=20, and the
; app never sees a 53300 no matter how many goroutines it runs.
max_client_conn = 500
default_pool_size = 5
