name: connection-pooling

services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: db
    ports:
      - "5555:5432"
    # 4 cores so we can reach the ceiling faster without allowing so many connections.
    deploy:
      resources:
        limits:
          cpus: "4"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 2s
      timeout: 2s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer:/etc/pgbouncer:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
