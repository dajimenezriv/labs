name: labs

services:
  postgres:
    image: postgres:18-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: db
    ports:
      - "5555:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
