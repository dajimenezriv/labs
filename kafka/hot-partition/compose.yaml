name: hot-partition

# One broker. A hot partition is a property of the key and the partition count,
# not of replication: every partition here would be exactly as hot on three
# brokers, and the consumer that owns it exactly as alone.
#
# Everything is stock except what a one-broker cluster forces (internal topics
# at replication factor 1). No group or consumer timeout is tuned: nothing in
# this lab is waiting out a failure.

services:
  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: hot-partition-lab
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # The exporter reaches "kafka", the lab on the host reaches "localhost".
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Per-partition lag and which member owns each partition, from the broker's
  # side. The run itself prints the same numbers; this is for watching them.
  exporter:
    build: .
    command:
      - exporter
      - -brokers=kafka:9092
      - -addr=:9200
      - -prefix=hot-
    ports:
      - "9200:9200"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:
