name: delivery-guarantees

# Three brokers, because every question in this lab needs a survivor: you
# cannot kill a leader on a one-broker cluster, and min.insync.replicas=2 on
# one broker is a permanent outage rather than a guarantee.
#
# Combined mode (broker + controller on every node) so the controller quorum is
# 3 and survives the same kill. Everything else is stock: unclean leader
# election stays off, replica.lag.time.max.ms stays at 30s. The losses this lab
# measures come from killing a process, not from configuration.

x-kafka: &kafka
  image: apache/kafka:4.1.0
  # Shared, fixed, and identical across the three -- the image formats its own
  # storage on first boot and would otherwise generate a different cluster id
  # per container, leaving three one-node clusters that refuse to talk.
  environment: &kafka-env
    CLUSTER_ID: delivery-guarantees-lab
    # Without this the image puts the logs in /tmp/kafka-logs and the volume
    # below holds nothing -- which survives a broker kill (the container is
    # restarted, not recreated) and quietly loses everything on a rebuild.
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    # No delay before the first rebalance: the crash variants restart a
    # consumer and wait for it to rejoin, and 3s of stock delay per restart is
    # dead time in a loop that runs six times.
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
      ]
    interval: 5s
    timeout: 10s
    retries: 20
    start_period: 15s

services:
  kafka1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # Two advertised listeners because the address depends on who is asking:
      # the other brokers reach "kafka1", the host reaches "localhost".
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,EXTERNAL://localhost:29092
    ports:
      - "29092:29092"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,EXTERNAL://localhost:29093
    ports:
      - "29093:29093"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,EXTERNAL://localhost:29094
    ports:
      - "29094:29094"
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # Reads the cluster over the admin protocol and serves it as Prometheus
  # gauges: leader, ISR size, high watermark, and every consumer group's
  # committed offset and lag. The point of having it is section 4 -- three of
  # the four failures in this lab are plainly visible in these numbers, and the
  # one that destroys data is not.
  exporter:
    build: .
    command:
      - exporter
      - -brokers=kafka1:9092,kafka2:9092,kafka3:9092
      - -addr=:9200
      # Skips __consumer_offsets and anything the main kurita stack left behind.
      - -prefix=seq-
    ports:
      - "9200:9200"
    depends_on:
      kafka1:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 1s scraping for minutes at a time is a lot of samples for a retention
      # default measured in weeks.
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  prometheus-data:
  grafana-data:
