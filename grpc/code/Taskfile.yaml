version: "3"

tasks:
  main:
    cmd: go run .

  proto:
    cmd: protoc
      --go_out=.
      --go_opt=paths=source_relative
      --go-grpc_out=.
      --go-grpc_opt=paths=source_relative
      proto/*.proto

  breaking:
    cmd: buf breaking --against '../../.git#branch=main,subdir=grpc/code/proto'
